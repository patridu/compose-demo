services:
  app-container:
    # Builds and pushes the image
    image: ghcr.io/patridu/compose-demo_app
    build: .
    environment:
      # Environment variable will be taken from the host
      - TESTENV=${HOSTNAME}

  redis-container:
    # Gets pinned to a specific release at publish time
    image: docker.io/valkey/valkey:latest
    # Restarts after host reboots and failures
    restart: unless-stopped
    healthcheck:
      test: '[ $$(valkey-cli ping) = ''PONG'' ]'
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5